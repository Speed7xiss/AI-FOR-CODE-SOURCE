services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: runa-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - runa-data:/app/storage/uploads
      - runa-db:/app/data
    extra_hosts:
      # permite que o container alcance um Ollama rodando no host
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: runa-frontend
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  runa-data:
  runa-db:
